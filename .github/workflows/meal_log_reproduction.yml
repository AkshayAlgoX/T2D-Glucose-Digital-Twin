name: Reproduce Meal Log

on:
  push:
    branches:
      - temp-gha-armd-meal-log

jobs:
  reproduce:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: System info
        run: |
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          sysctl -a | grep machdep.cpu || true

      - name: Setup Python 3.11.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Exactly the versions needed by reproduce_meal_log.py and train_pr_tft.py
          pip install numpy==2.4.6 pandas==3.0.6 torch==2.14.0 lightning==2.6.6 scikit-learn==1.9.1 jax==0.10.2 jaxlib==0.10.2 scipy xgboost fastapi pydantic uvicorn httpx jsonschema referencing

      - name: Run reproduction script
        run: python reproduce_meal_log.py

      - name: Upload canonical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-meal-log
          path: |
            canonical_meal_log.npz
            canonical_population_habit.npz
