      <rect x="0" y="0" width="200" height="80" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="24" fill="#94a3b8" font-size="11">HISTORICAL AUROC</text>
      <text x="16" y="56" fill="#ef4444" font-size="24" font-weight="700">0.9320</text>
