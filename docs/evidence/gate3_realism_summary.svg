<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="100%" style="background:#131822; border-radius:8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect x="24" y="20" width="712" height="200" rx="6" fill="rgba(239, 68, 68, 0.08)" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- Header -->
