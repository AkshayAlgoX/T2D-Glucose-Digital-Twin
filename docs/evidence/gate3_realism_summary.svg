    <text x="100" y="17" fill="#f8fafc" font-size="16" font-weight="600">Gate 3 Realism Audit: Indistinguishability Criterion</text>
    <text x="100" y="36" fill="#94a3b8" font-size="12">Discriminator AUROC exceeds target threshold (&lt;= 0.65) · Strict Negative Disclosure</text>
  </g>

  <!-- Scorecards -->
